name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - ghidra: "12.1.3"
            java: "21"
          - ghidra: "12.1.4"
            java: "21"
          - ghidra: "12.2"
            java: "25"
    env:
      GHIDRA_VERSION: ${{ matrix.ghidra }}
      JAVA_VERSION: ${{ matrix.java }}
      # Everything CI unpacks goes under scratch/, which build.gradle keeps out
      # of the zip: buildExtension packs the rest of the workspace.
      GHIDRA_INSTALL_DIR: ${{ github.workspace }}/scratch/ghidra
      JAVA_HOME: ${{ github.workspace }}/scratch/jdk
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK ${{ matrix.java }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/jdk.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/${JAVA_VERSION}/ga/linux/x64/jdk/hotspot/normal/eclipse"
          mkdir -p "$JAVA_HOME"
          tar -xzf /tmp/jdk.tar.gz -C "$JAVA_HOME" --strip-components=1
          "$JAVA_HOME/bin/java" -version

      - name: Download Ghidra ${{ matrix.ghidra }}
        run: |
          set -euo pipefail
          # Resolve the exact tag; older supported releases may not be on page 1.
          curl -fsSL "https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/tags/Ghidra_${GHIDRA_VERSION}_build" > /tmp/ghidra-release.json
          URL=$(python3 -c 'import json, os; r=json.load(open("/tmp/ghidra-release.json")); prefix="ghidra_"+os.environ["GHIDRA_VERSION"]+"_PUBLIC_"; print(next(a["browser_download_url"] for a in r["assets"] if a["name"].startswith(prefix) and a["name"].endswith(".zip")))')
          [ -n "$URL" ] || { echo "no Ghidra ${GHIDRA_VERSION} release asset found"; exit 1; }
          echo "downloading $URL"
          curl -fsSL -o /tmp/ghidra.zip "$URL"
          unzip -q /tmp/ghidra.zip -d /tmp/ghidra-extract
          mkdir -p "$(dirname "$GHIDRA_INSTALL_DIR")"
          mv /tmp/ghidra-extract/ghidra_* "$GHIDRA_INSTALL_DIR"
          ls "$GHIDRA_INSTALL_DIR/support/sleigh"

      - name: Check release-tool failure detection
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Verify the release candidate in both endian modes
        run: python3 tools/verify.py --jobs 2

      - name: Install virtual display for native GUI checks
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth

      - name: Verify native CodeBrowser and Decompiler integration
        run: |
          ARCHIVE=$(cat build/release-archive-path.txt)
          xvfb-run -a python3 tools/verify_gui.py --archive "$ARCHIVE"

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-c6000-verification-${{ matrix.ghidra }}
          path: |
            scratch/verify-*/summary.json
            scratch/verify-*/build.log
            scratch/verify-*/*/*/*.log
            scratch/verify-gui-*/summary.json
            scratch/verify-gui-*/gui.log
            scratch/verify-gui-*/compile.log
            scratch/verify-gui-*/*.png
            scratch/verify-gui-*/*.c
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-c6000-extension-${{ matrix.ghidra }}
          path: dist/*_C6000.zip
